<!doctype html>
<html lang="ja" data-case="short-static">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>黄変化フィルター構造比較</title>
    <script>
      (() => {
        const allowedCases = new Set([
          "short-static",
          "tall-static",
          "tall-dynamic",
          "app-shell",
          "sticky",
          "tall-wide-region",
        ]);
        const requestedCase = new URLSearchParams(location.search).get("case") || "short-static";
        document.documentElement.dataset.case = allowedCases.has(requestedCase) ? requestedCase : "short-static";
      })();
    </script>
    <style>
      * { box-sizing: border-box; }
      html { background: #ececec; }
      body { min-width: 320px; margin: 0; color: #111; font-family: system-ui, sans-serif; }
      .definitions { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
      .diagnostic-intro, .diagnostic-output { width: min(100% - 24px, 430px); margin: 12px auto; }
      .diagnostic-intro { padding: 12px; border: 1px solid #777; background: #fff; }
      .diagnostic-intro h1 { margin: 0 0 8px; font-size: 18px; }
      .diagnostic-intro p { margin: 4px 0; font-size: 13px; line-height: 1.5; }
      .filter-target { -webkit-filter: url("#lens-reference-20-70-structure"); filter: url("#lens-reference-20-70-structure"); }
      html[data-case="tall-wide-region"] .filter-target { -webkit-filter: url("#lens-reference-20-70-structure-wide"); filter: url("#lens-reference-20-70-structure-wide"); }
      .phone-shell { background: #f6f6f6; }
      html[data-case="app-shell"] .phone-shell,
      html[data-case="sticky"] .phone-shell {
        position: relative;
        width: min(100vw, 430px);
        min-height: 100vh;
        margin: 0 auto;
        padding-bottom: 92px;
        overflow-x: hidden;
        box-shadow: 0 0 28px rgba(0, 0, 0, 0.14);
      }
      html[data-case="sticky"] .phone-shell {
        overflow: visible;
      }
      html[data-case="sticky"] .diagnostic-intro {
        display: none;
      }
      html[data-case="sticky"] .filter-target {
        height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .test-header { padding: 18px; border-bottom: 1px solid #bbb; background: #fff; }
      .test-header h2 { margin: 0; font-size: 20px; }
      .test-tabs { display: flex; gap: 10px; padding: 12px; border-bottom: 1px solid #bbb; background: #fff; }
      .test-tabs span { padding: 8px; border: 1px solid #aaa; background: #fff; font-weight: 700; }
      html[data-case="sticky"] .test-header {
        position: sticky;
        top: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        min-height: 66px;
      }
      html[data-case="sticky"] .test-tabs {
        position: sticky;
        top: 66px;
        z-index: 2;
      }
      .patches { display: grid; grid-template-columns: repeat(3, 1fr); height: 78px; border: 1px solid #111; }
      .patches div { display: grid; place-items: center; font-weight: 800; }
      .white { background: #fff; color: #000; }
      .gray { background: #808080; color: #000; }
      .black { background: #000; color: #fff; }
      .patch-label { margin: 0; padding: 10px 14px; background: #fff; font-weight: 800; }
      .filler { height: 120px; background: linear-gradient(#fff 0 50%, #d8d8d8 50%); }
      html[data-case="tall-static"] .filler,
      html[data-case="tall-dynamic"] .filler,
      html[data-case="app-shell"] .filler,
      html[data-case="sticky"] .filler,
      html[data-case="tall-wide-region"] .filler { height: 2800px; }
      .diagnostic-output { padding: 12px; background: #111; color: #fff; font: 12px/1.5 monospace; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <svg class="definitions" aria-hidden="true" focusable="false">
      <defs>
        <filter id="lens-reference-20-70-structure" color-interpolation-filters="linearRGB" x="0" y="0" width="100%" height="100%">
          <feColorMatrix type="matrix" values="0.932675028852 0.046440604984 -0.016148691713 0 0 -0.005685981497 0.707416751687 0.022443569675 0 0 -0.009362782733 -0.027474700634 0.386341069418 0 0 0 0 0 1 0" />
        </filter>
        <filter id="lens-reference-20-70-structure-wide" color-interpolation-filters="linearRGB" x="-10%" y="-10%" width="120%" height="120%">
          <feColorMatrix type="matrix" values="0.932675028852 0.046440604984 -0.016148691713 0 0 -0.005685981497 0.707416751687 0.022443569675 0 0 -0.009362782733 -0.027474700634 0.386341069418 0 0 0 0 0 1 0" />
        </filter>
      </defs>
    </svg>

    <section class="diagnostic-intro">
      <h1>黄変化フィルター構造比較</h1>
      <p id="case-description"></p>
      <p>上端と下端の白は、変換時の基準値ではおおむね <strong>#FBDDA0</strong> になります。</p>
    </section>

    <main id="structure-filter-target" class="filter-target">
      <div class="phone-shell">
        <header class="test-header"><h2>構造比較ページ</h2></header>
        <nav class="test-tabs"><span>おすすめ</span><span>お弁当</span><span>単品</span></nav>
        <p class="patch-label">対象上端</p>
        <div class="patches"><div class="white">W</div><div class="gray">G</div><div class="black">B</div></div>
        <div id="sticky-scroll-point" class="filler" aria-hidden="true"></div>
        <p class="patch-label">対象下端</p>
        <div class="patches"><div class="white">W</div><div class="gray">G</div><div class="black">B</div></div>
      </div>
    </main>

    <pre id="structure-diagnostics" class="diagnostic-output"></pre>
    <script>
      (() => {
        const testCase = document.documentElement.dataset.case;
        const target = document.querySelector("#structure-filter-target");
        const descriptions = {
          "short-static": "基準: 小さな静的フィルター対象。",
          "tall-static": "short-static に対象の高さだけを追加。documentがスクロールを担当。",
          "tall-dynamic": "tall-static に、本体と同じinnerHTML再生成とフィルター再解決だけを追加。",
          "app-shell": "tall-dynamic に、本体相当のphone-shell寸法・overflow-x:hiddenだけを追加。",
          "sticky": "フィルター対象自身を縦スクロール要素にし、見出しをtop:0、カテゴリをtop:66pxへ固定。固定前後の変換を比較。",
          "tall-wide-region": "tall-static と同じ構造で、SVGフィルター領域だけを-10%/120%へ拡張。行列は同一。",
        };
        document.querySelector("#case-description").textContent = `case=${testCase}: ${descriptions[testCase]}`;

        if (["tall-dynamic", "app-shell", "sticky"].includes(testCase)) {
          const markup = target.innerHTML;
          target.innerHTML = markup;
          target.style.webkitFilter = "none";
          target.style.filter = "none";
          void target.offsetWidth;
          target.style.webkitFilter = "";
          target.style.filter = "";
        }

        const style = getComputedStyle(target);
        const rect = target.getBoundingClientRect();
        const tabs = target.querySelector(".test-tabs");
        const tabStyle = getComputedStyle(tabs);
        document.querySelector("#structure-diagnostics").textContent = [
          "page build: structure-20261102-3",
          `case: ${testCase}`,
          `viewport: ${innerWidth}x${innerHeight} dpr=${devicePixelRatio}`,
          `document scrollHeight: ${document.documentElement.scrollHeight}`,
          `target rect: ${Math.round(rect.width)}x${Math.round(rect.height)} top=${Math.round(rect.top)}`,
          `target scroll/client: ${target.scrollHeight}/${target.clientHeight}`,
          `computed filter: ${style.filter || "未取得"}`,
          `computed -webkit-filter: ${style.webkitFilter || style.getPropertyValue("-webkit-filter") || "未取得"}`,
          `tabs position: ${tabStyle.position}`,
          `tabs top: ${tabStyle.top}`,
          `shell overflow: ${getComputedStyle(target.querySelector(".phone-shell")).overflowX}/${getComputedStyle(target.querySelector(".phone-shell")).overflowY}`,
          `SVG exact: ${document.querySelector("#lens-reference-20-70-structure") ? "present" : "missing"}`,
          `SVG wide: ${document.querySelector("#lens-reference-20-70-structure-wide") ? "present" : "missing"}`,
          `user agent: ${navigator.userAgent}`,
        ].join("\n");

        if (new URLSearchParams(location.search).get("autoscroll") === "1") {
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (testCase === "sticky") target.scrollTop = 520;
            else window.scrollTo(0, 520);
          }));
        }
      })();
    </script>
  </body>
</html>
