<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Order UI Simulator</title>
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/theme.css" />
  </head>
  <body>
    <svg class="visual-filter-definitions" aria-hidden="true" focusable="false">
      <defs>
        <filter id="lens-reference-20-70" color-interpolation-filters="linearRGB" x="0" y="0" width="100%" height="100%">
          <feColorMatrix
            type="matrix"
            values="0.932675028852 0.046440604984 -0.016148691713 0 0 -0.005685981497 0.707416751687 0.022443569675 0 0 -0.009362782733 -0.027474700634 0.386341069418 0 0 0 0 0 1 0"
          />
        </filter>
      </defs>
    </svg>
    <main id="app"></main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const debugEnabled = params.get("debug") === "1";
        const diagnosticVariant = params.get("diag") || "baseline";
        if (debugEnabled) document.documentElement.dataset.diagnosticVariant = diagnosticVariant;
        const diagnostics = {
          enabled: debugEnabled,
          variant: diagnosticVariant,
          errors: [],
        };
        window.__simulatorDiagnostics = diagnostics;

        const recordError = (message) => {
          diagnostics.errors.push(String(message));
          if (typeof window.__renderSimulatorDiagnostics === "function") {
            window.__renderSimulatorDiagnostics();
          } else {
            const panel = document.querySelector("#simulator-debug-panel");
            if (panel) panel.textContent = "JavaScript読み込み前エラー\n" + diagnostics.errors.join("\n");
          }
        };

        if (debugEnabled && diagnosticVariant !== "panel-off") {
          const panel = document.createElement("aside");
          panel.id = "simulator-debug-panel";
          panel.setAttribute("aria-live", "polite");
          panel.style.cssText = "position:fixed;right:0;bottom:0;left:0;z-index:2147483647;max-height:46vh;overflow:auto;margin:0;padding:10px;background:rgba(15,15,15,.94);color:#fff;font:11px/1.45 monospace;white-space:pre-wrap;word-break:break-all;text-align:left;";
          panel.textContent = "診断情報を読み込み中…";
          document.body.appendChild(panel);

          window.addEventListener("error", (event) => {
            recordError(`${event.message || "Script error"} @ ${event.filename || "unknown"}:${event.lineno || 0}:${event.colno || 0}`);
          });
          window.addEventListener("unhandledrejection", (event) => {
            const reason = event.reason?.stack || event.reason?.message || event.reason || "Unknown rejection";
            recordError(`Unhandled rejection: ${reason}`);
          });
        }

        const validTask = ["1", "2", "3", "4"].includes(params.get("task"));
        const validColor = ["pastel", "contrast"].includes(params.get("color"));
        const validYellow = ["0", "1"].includes(params.get("yellow"));
        if (validTask && validColor && validYellow && params.get("yellow") === "1") {
          document.querySelector("#app").dataset.visionFilter = "yellowed";
        }
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
